name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build and test on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test suite (-O0, optimizer off)
        run: bash tests/run_tests.sh ./build/minicc -O0
      - name: Test suite (-O1, optimizer on)
        run: bash tests/run_tests.sh ./build/minicc -O1
      - name: Diagnostics and CLI tests
        run: bash tests/run_diag_tests.sh ./build/minicc
      - name: Benchmarks (-O0 vs -O1)
        run: bash bench/bench.sh ./build/minicc