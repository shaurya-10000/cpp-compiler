name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # Windows CI will fail if we try to run x86-64 Linux asm
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test (Compile to asm)
        run: |
          echo 'int main() { return 42; }' > test.cpp
          ./build/minicc --compile test.cpp > test.s
          gcc test.s -o test
          ./test
          if [ $? -ne 42 ]; then exit 1; fi
