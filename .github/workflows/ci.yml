name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test (Compile to asm)
        run: |
          cat << 'EOF' > test.cpp
          int main() {
              print_str("Hello, world!\n");
              return 42;
          }
          EOF
          ./build/minicc --compile test.cpp > test.s
          gcc test.s -o test
          
          # Disable default bash error exit to capture the code
          set +e
          ./test
          EXIT_CODE=$?
          set -e
          
          echo "Program exited with: $EXIT_CODE"
          if [ $EXIT_CODE -ne 42 ]; then 
            echo "Expected 42, got $EXIT_CODE"
            exit 1
          fi
