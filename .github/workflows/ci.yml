name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        run: |
          echo 'int main() {' > test.cpp
          echo '    print_str("Testing loops:\n");' >> test.cpp
          echo '    for (int i = 0; i < 5; i = i + 1) {' >> test.cpp
          echo '        if (i == 2) { continue; }' >> test.cpp
          echo '        if (i == 4) { break; }' >> test.cpp
          echo '        print_int(i);' >> test.cpp
          echo '    }' >> test.cpp
          echo '    return 0;' >> test.cpp
          echo '}' >> test.cpp

          ./build/minicc --compile test.cpp > test.s
          gcc test.s -o test
          
          ./test > out.txt
          
          echo 'Testing loops:' > expected.txt
          echo '0' >> expected.txt
          echo '1' >> expected.txt
          echo '3' >> expected.txt
          
          sed -i 's/\r$//' out.txt expected.txt
          diff -u expected.txt out.txt
          echo "Output matched exactly!"
