name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        run: |
          ./build/minicc --compile test.cpp > test.s
          gcc test.s -o test
          ./test > out.txt
          
          sed -i 's/\r$//' out.txt expected.txt
          diff -u expected.txt out.txt
          echo "Output matched exactly!"
