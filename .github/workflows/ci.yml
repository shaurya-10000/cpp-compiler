name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test (Compile to asm)
        run: |
          printf 'int main() {\n  print_str("Hello, world!\\n");\n  return 42;\n}' > test.cpp
          ./build/minicc --compile test.cpp > test.s
          gcc test.s -o test
          ./test
          if [ $? -ne 42 ]; then exit 1; fi
