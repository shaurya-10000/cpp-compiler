name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        run: |
          echo 'int main() {' > test.cpp
          echo '    print_str("Hello from Phase 4!\n");' >> test.cpp
          echo '    print_int(42 + 8);' >> test.cpp
          echo '    return 0;' >> test.cpp
          echo '}' >> test.cpp

          ./build/minicc --compile test.cpp > test.s
          gcc test.s -o test
          
          ./test > out.txt
          
          echo 'Hello from Phase 4!' > expected.txt
          echo '50' >> expected.txt
          
          diff -u expected.txt out.txt
          echo "Output matched exactly!"
