name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        run: |
          cat << 'EOF' > test.cpp
          int main() {
              print_str("Testing loops:\n");
              for (int i = 0; i < 5; i = i + 1) {
                  if (i == 2) { continue; }
                  if (i == 4) { break; }
                  print_int(i);
              }
              return 0;
          }
          EOF

          ./build/minicc --compile test.cpp > test.s
          gcc test.s -o test
          
          ./test > out.txt
          
          cat << 'EOF' > expected.txt
          Testing loops:
          0
          1
          3
          EOF
          
          sed -i 's/\r$//' out.txt expected.txt
          diff -u expected.txt out.txt
          echo "Output matched exactly!"
